<h2>Reset your GoTogether password</h2>
<p>We received a request to reset the password for your GoTogether account.</p>
<p><a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password">Set a new password</a></p>
<p>This link works once and expires in 1 hour. If you didn't ask to reset your password, you can ignore this email — your password won't change.</p>
